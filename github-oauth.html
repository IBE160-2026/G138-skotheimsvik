<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sign in to GitHub · GitHub</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --border: #30363d;
        --text: #f0f6fc;
        --muted: #8b949e;
        --input-bg: #0d1117;
        --green: #238636;
        --green-hover: #2ea043;
        --green-border: rgba(240, 246, 252, 0.1);
        --blue: #2f81f7;
        --danger-bg: rgba(248, 81, 73, 0.1);
        --danger-border: rgba(248, 81, 73, 0.4);
        --danger-text: #ff7b72;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px;
      }

      .gh-header {
        padding-top: 8px;
        padding-bottom: 24px;
        text-align: center;
      }

      .gh-logo {
        color: #f0f6fc;
        display: inline-block;
      }

      .gh-title {
        font-size: 24px;
        font-weight: 300;
        letter-spacing: -0.5px;
        margin: 16px 0 0;
        text-align: center;
      }

      .gh-subtitle {
        color: var(--muted);
        font-size: 13px;
        margin: 6px 0 0;
        text-align: center;
      }

      .gh-subtitle strong {
        color: var(--text);
        font-weight: 600;
      }

      .gh-container {
        width: 100%;
        max-width: 308px;
        margin-top: 16px;
      }

      .gh-flash {
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        color: var(--danger-text);
        border-radius: 6px;
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 13px;
      }

      .gh-box {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 16px;
      }

      .gh-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 400;
        text-align: left;
      }

      .gh-input {
        width: 100%;
        padding: 5px 12px;
        font-size: 14px;
        line-height: 20px;
        color: var(--text);
        background-color: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-top: 4px;
        margin-bottom: 16px;
        outline: none;
      }

      .gh-input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.3);
      }

      .gh-btn {
        width: 100%;
        display: inline-block;
        padding: 5px 16px;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        text-align: center;
        color: #ffffff;
        background-color: var(--green);
        border: 1px solid var(--green-border);
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.12s ease;
      }

      .gh-btn:hover:not(:disabled) {
        background-color: var(--green-hover);
      }

      .gh-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .gh-callout {
        margin-top: 16px;
        padding: 16px;
        text-align: center;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        color: var(--muted);
      }

      .gh-callout a {
        color: var(--blue);
        text-decoration: none;
      }

      .gh-callout a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header class="gh-header">
      <span class="gh-logo" aria-hidden="true">
        <svg height="48" viewBox="0 0 16 16" width="48" fill="currentColor">
          <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
        </svg>
      </span>
      <h1 class="gh-title">Sign in to GitHub</h1>
      <p class="gh-subtitle">to continue to <strong>LearningHub</strong></p>
    </header>

    <main class="gh-container">
      <div id="gh-error" class="gh-flash" hidden></div>

      <div class="gh-box">
        <form id="gh-form">
          <label class="gh-label" for="gh-username">GitHub username</label>
          <input
            id="gh-username"
            class="gh-input"
            type="text"
            name="login"
            autocomplete="username"
            autocapitalize="off"
            spellcheck="false"
            autofocus
            required
          />
          <button id="gh-submit" class="gh-btn" type="submit">Authorize &amp; Sign in</button>
        </form>
      </div>

      <div class="gh-callout">
        <a id="gh-cancel" href="./index.html">Cancel and return to LearningHub</a>
      </div>
    </main>

    <script type="module" src="./src/ui/github-oauth.js"></script>
  </body>
</html>
